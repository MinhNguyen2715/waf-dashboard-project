services:
  juice-shop:
    image: bkimminich/juice-shop:latest
    container_name: waf-juice-shop
    restart: unless-stopped
    networks:
      - waf-net

  waf-proxy:
    image: owasp/modsecurity-crs:nginx-alpine
    container_name: waf-nginx-modsec
    user: root
    restart: unless-stopped
    ports:
      - "80:80"
    entrypoint: >
      sh -c "mkdir -p /var/log/modsec && chmod -R 777 /var/log/modsec &&
      exec nginx -e /var/log/nginx/error.log -g 'load_module modules/ngx_http_modsecurity_module.so; daemon off;'"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:80/ > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/modsec:/etc/nginx/modsec:ro
      - ./nginx/modsecurity-crs:/etc/nginx/modsecurity-crs:ro
      - modsec_logs:/var/log/modsec
    depends_on:
      - juice-shop
    networks:
      - waf-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: waf-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - modsec_logs:/var/log/modsec:ro
      - ./backend/data:/app/data
      - ./backend/model:/app/model:ro
    depends_on:
      - waf-proxy
    networks:
      - waf-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: waf-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - waf-net

volumes:
  modsec_logs:

networks:
  waf-net:
    driver: bridge
