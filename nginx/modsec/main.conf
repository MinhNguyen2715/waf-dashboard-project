# ==============================================================================
# MODSECURITY MAIN CONFIGURATION INDEX
# ==============================================================================

# 1. Load ModSecurity Core Settings & Audit Logging Configuration
Include /etc/nginx/modsec/modsecurity.conf

# 2. Load OWASP Core Rule Set (CRS) Setup & Base Rules
Include /etc/nginx/modsecurity-crs/crs-setup.conf
Include /etc/nginx/modsecurity-crs/rules/*.conf

# ==============================================================================
# PERFORMANCE & EXCLUSION RULES FOR JUICE SHOP
# ==============================================================================

# Disable response body inspection to optimize CPU/RAM (focus on inbound requests)
SecResponseBodyAccess Off

# Process partial request bodies up to the limit instead of dropping connections
SecRequestBodyLimitAction ProcessPartial

# Bypass WAF inspection for static assets and media files
SecRule REQUEST_URI "\.(?:css|js|png|jpe?g|gif|ico|svg|woff2?|ttf|eot|map)$" \
    "id:10001,phase:1,nolog,allow,ctl:ruleEngine=Off"

# Bypass WAF inspection for Angular frontend assets directory
SecRule REQUEST_URI "^/assets/" \
    "id:10002,phase:1,nolog,allow,ctl:ruleEngine=Off"

# Completely bypass ModSecurity engine and audit logging for Socket.IO traffic
SecRule REQUEST_URI "^/socket\.io/" \
    "id:10003,phase:1,nolog,allow,ctl:ruleEngine=Off,ctl:auditEngine=Off"
